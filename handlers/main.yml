---

- name: "Restart Kubernetes containerd"
  ansible.builtin.service:
    name: "{{ kubernetes_containerd_service_name }}"
    state: restarted

- name: "Restart Kubernetes CRI-O"
  ansible.builtin.service:
    name: "{{ kubernetes_crio_service_name }}"
    state: restarted

- name: "Apply Kubernetes sysctl configuration"
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: "Reload firewalld for Kubernetes"
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
