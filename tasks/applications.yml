---
- name: "Checking Kubernetes admin kubeconfig for applications"
  ansible.builtin.stat:
    path: "{{ kubernetes_control_plane_admin_kubeconfig }}"
  register: kubernetes_applications_admin_kubeconfig

- name: "Requiring Kubernetes admin kubeconfig for applications"
  ansible.builtin.assert:
    that:
      - kubernetes_applications_admin_kubeconfig.stat.exists
    fail_msg: >-
      Kubernetes applications require the control-plane kubeconfig at
      {{ kubernetes_control_plane_admin_kubeconfig }}.

- name: "Applying Kubernetes application manifests"
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ kubernetes_control_plane_admin_kubeconfig }}
      - apply
      - -f
      - "-"
    stdin: "{{ kubernetes_manifest_record.manifest }}"
    stdin_add_newline: true
  register: kubernetes_application_apply
  changed_when: >-
    "created" in kubernetes_application_apply.stdout or
    "configured" in kubernetes_application_apply.stdout or
    "pruned" in kubernetes_application_apply.stdout
  failed_when: kubernetes_application_apply.rc != 0
  loop: >-
    {{ kubernetes_manifest_applications
       | selectattr('state', 'equalto', 'present') | list }}
  loop_control:
    loop_var: kubernetes_manifest_record
    label: "{{ kubernetes_manifest_record.name }}"

- name: "Installing Kubernetes Helm applications"
  ansible.builtin.include_tasks: helm_application_present.yml
  loop: >-
       {{ kubernetes_applications
        | selectattr('type', 'equalto', 'helm')
       | selectattr('state', 'equalto', 'present')
       | selectattr('repo_url', 'defined') | list }}
  loop_control:
    loop_var: kubernetes_helm_record
    label: "{{ kubernetes_helm_record.name }}"

- name: "Installing Kubernetes local Helm charts"
  ansible.builtin.include_tasks: helm_application_present.yml
  vars:
    kubernetes_helm_record: "{{ kubernetes_local_helm_record }}"
  loop: >-
       {{ kubernetes_applications
        | selectattr('type', 'equalto', 'helm')
       | selectattr('state', 'equalto', 'present')
       | selectattr('repo_url', 'undefined') | list }}
  loop_control:
    loop_var: kubernetes_local_helm_record
    label: "{{ kubernetes_local_helm_record.name }}"

- name: "Removing Kubernetes application manifests"
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ kubernetes_control_plane_admin_kubeconfig }}
      - delete
      - --ignore-not-found=true
      - -f
      - "-"
    stdin: "{{ kubernetes_absent_manifest_record.manifest }}"
    stdin_add_newline: true
  register: kubernetes_application_delete
  changed_when: >-
    "deleted" in kubernetes_application_delete.stdout or
    "deleted" in kubernetes_application_delete.stderr
  failed_when: kubernetes_application_delete.rc != 0
  loop: >-
    {{ kubernetes_manifest_applications
       | selectattr('state', 'equalto', 'absent') | list }}
  loop_control:
    loop_var: kubernetes_absent_manifest_record
    label: "{{ kubernetes_absent_manifest_record.name }}"

- name: "Removing Kubernetes Helm applications"
  ansible.builtin.command:
    argv:
      - "{{ kubernetes_helm_binary_path }}"
      - uninstall
      - "{{ kubernetes_absent_helm_record.release_name | default(kubernetes_absent_helm_record.name) }}"
      - --namespace
      - "{{ kubernetes_absent_helm_record.namespace }}"
      - --kubeconfig
      - "{{ kubernetes_control_plane_admin_kubeconfig }}"
      - --ignore-not-found
  register: kubernetes_helm_delete_result
  changed_when: >-
    "uninstalled" in kubernetes_helm_delete_result.stdout or
    "uninstalled" in kubernetes_helm_delete_result.stderr
  failed_when: kubernetes_helm_delete_result.rc != 0
  no_log: true
  loop: >-
       {{ kubernetes_applications
        | selectattr('type', 'equalto', 'helm')
       | selectattr('state', 'equalto', 'absent') | list }}
  loop_control:
    loop_var: kubernetes_absent_helm_record
    label: "{{ kubernetes_absent_helm_record.name }}"
