---

- name: "Checking if operating system is supported"
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] in (iac_supported_os | map(attribute="name") | list)
      - >-
        ansible_facts["distribution_major_version"] in
        (iac_supported_os | selectattr("name", "equalto", ansible_facts["distribution"])
        | map(attribute="versions") | first)
    fail_msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"

- name: "Require Kubernetes blueprint root"
  ansible.builtin.assert:
    that:
      - iac_blueprint is mapping
      - iac_blueprint.kubernetes is defined
      - iac_blueprint.kubernetes is mapping
    fail_msg: "iac_blueprint.kubernetes is required and must be a mapping; no host changes were made."

- name: "Validate requested Kubernetes state"
  ansible.builtin.assert:
    that: state in ["validate", "present", "absent", "install", "uninstall"]
    fail_msg: "Unsupported Kubernetes state '{{ state }}'; use validate, present, absent, install, or uninstall."

- name: "Normalize Kubernetes public blueprint"
  ansible.builtin.set_fact:
    kubernetes_blueprint: "{{ iac_blueprint.kubernetes }}"
    kubernetes_application_records_input: "{{ iac_blueprint.kubernetes.applications | default(kubernetes_applications | default([]), true) }}"
    kubernetes_container_runtime: "{{ iac_blueprint.kubernetes.container_runtime | default(kubernetes_container_runtime) }}"
    kubernetes_selinux_state: "{{ iac_blueprint.kubernetes.selinux_state | default(kubernetes_selinux_state) }}"
    kubernetes_control_plane_state: "{{ iac_blueprint.kubernetes.control_plane_state | default(kubernetes_control_plane_state) }}"
    kubernetes_worker_state: "{{ iac_blueprint.kubernetes.worker_state | default(kubernetes_worker_state) }}"
    kubernetes_cni: "{{ iac_blueprint.kubernetes.cni | default(kubernetes_cni) }}"
    kubernetes_cni_state: "{{ iac_blueprint.kubernetes.cni_state | default(kubernetes_cni_state) }}"
    kubernetes_control_plane_api_port: "{{ iac_blueprint.kubernetes.api_port | default(kubernetes_control_plane_api_port) }}"
    kubernetes_control_plane_inventory_hostname: >-
       {{ iac_blueprint.kubernetes.control_plane_inventory_hostname
          | default(kubernetes_control_plane_inventory_hostname) }}

- name: "Normalize Kubernetes application record types"
  ansible.builtin.set_fact:
    kubernetes_applications: []

- name: "Default omitted Kubernetes application types to manifests"
  ansible.builtin.set_fact:
    kubernetes_applications: >-
      {{ kubernetes_applications +
         [kubernetes_application_record | combine({
           "type": kubernetes_application_record.type | default("manifest")
         }) if kubernetes_application_record is mapping else kubernetes_application_record] }}
  loop: "{{ kubernetes_application_records_input }}"
  loop_control:
    loop_var: kubernetes_application_record

- name: "Validate Kubernetes inventory blueprint before mutation"
  ansible.builtin.include_tasks: validate/validate_inventory.yml

- name: "Classify normalized Kubernetes applications"
  ansible.builtin.set_fact:
    kubernetes_manifest_applications: >-
      {{ kubernetes_applications | selectattr('type', 'equalto', 'manifest') | list }}

- name: "Stop after Kubernetes validation"
  ansible.builtin.meta: end_host
  when: state == "validate"


- name: "Removing Kubernetes applications"
  ansible.builtin.include_tasks: applications_absent.yml
  when:
    - state in ["absent", "uninstall"]
    - kubernetes_applications | length > 0

- name: "Uninstalling Kubernetes"
  ansible.builtin.include_tasks: uninstall.yml
  when: state in ["absent", "uninstall"]

- name: "Ensuring Kubernetes host preparation"
  ansible.builtin.include_tasks: host_preparation.yml
  when: state in ["present", "install"]

- name: "Applying Kubernetes host preparation before bootstrap"
  ansible.builtin.meta: flush_handlers
  when: state in ["present", "install"]

- name: "Ensuring Kubernetes control plane is present"
  ansible.builtin.include_tasks: control_plane_present.yml
  when:
    - state in ["present", "install"]
    - kubernetes_control_plane_state == "present"

- name: "Ensuring Kubernetes CNI is absent"
  ansible.builtin.include_tasks: "cni_{{ kubernetes_cni }}_absent.yml"
  when:
    - state in ["present", "install"]
    - kubernetes_cni_state == "absent"

- name: "Ensuring Kubernetes CNI is present"
  ansible.builtin.include_tasks: "cni_{{ kubernetes_cni }}_present.yml"
  when:
    - state in ["present", "install"]
    - kubernetes_control_plane_state == "present"
    - kubernetes_cni_state == "present"
    - kubernetes_control_plane_inventory_hostname | length == 0
      or inventory_hostname == kubernetes_control_plane_inventory_hostname

- name: "Ensuring Kubernetes applications are present or absent"
  ansible.builtin.include_tasks: applications.yml
  when:
    - state in ["present", "install"]
    - kubernetes_control_plane_state == "present"
    - kubernetes_control_plane_inventory_hostname | length == 0
      or inventory_hostname == kubernetes_control_plane_inventory_hostname
    - kubernetes_applications | length > 0

- name: "Ensuring Kubernetes control plane is absent"
  ansible.builtin.include_tasks: control_plane_absent.yml
  when:
    - state in ["present", "install"]
    - kubernetes_control_plane_state == "absent"

- name: "Ensuring Kubernetes worker node is joined"
  ansible.builtin.include_tasks: worker_present.yml
  when:
    - state in ["present", "install"]
    - kubernetes_worker_state == "present"

- name: "Ensuring Kubernetes worker node is absent"
  ansible.builtin.include_tasks: worker_absent.yml
  when:
    - state in ["present", "install"]
    - kubernetes_worker_state == "absent"

- name: "Reporting Kubernetes role smoke-test readiness"
  ansible.builtin.debug:
    msg: >-
      Kubernetes role smoke test reached {{ inventory_hostname }} on
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_major_version"] }}
