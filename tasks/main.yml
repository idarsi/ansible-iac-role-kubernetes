---

- name: "Checking if operating system is supported"
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] in (iac_supported_os | map(attribute="name") | list)
      - ansible_facts["distribution_major_version"] in (
          iac_supported_os
          | selectattr("name", "equalto", ansible_facts["distribution"])
          | map(attribute="versions")
          | first
        )
    fail_msg: >-
      Unsupported operating system:
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_major_version"] }}

- name: "Checking if container runtime is supported"
  ansible.builtin.assert:
    that:
      - kubernetes_container_runtime in ["containerd", "crio"]
    fail_msg: >-
      Unsupported Kubernetes container runtime:
      {{ kubernetes_container_runtime }}

- name: "Checking if Kubernetes state is supported"
  ansible.builtin.assert:
    that:
      - state in ["present", "absent", "install", "uninstall"]
    fail_msg: "Unsupported Kubernetes state: {{ state }}"

- name: "Checking if SELinux state is supported"
  ansible.builtin.assert:
    that:
      - kubernetes_selinux_state in ["enforcing", "permissive", "disabled"]
    fail_msg: "Unsupported SELinux state: {{ kubernetes_selinux_state }}"

- name: "Checking if control-plane state is supported"
  ansible.builtin.assert:
    that:
      - kubernetes_control_plane_state in ["present", "absent"]
    fail_msg: >-
      Unsupported Kubernetes control-plane state:
      {{ kubernetes_control_plane_state }}

- name: "Checking if worker state is supported"
  ansible.builtin.assert:
    that:
      - kubernetes_worker_state in ["present", "absent"]
      - kubernetes_control_plane_inventory_hostname | length > 0
        or kubernetes_worker_state == "absent"
    fail_msg: >-
      Unsupported Kubernetes worker configuration:
      {{ kubernetes_worker_state }} /
      {{ kubernetes_control_plane_inventory_hostname }}

- name: "Checking if CNI is supported"
  ansible.builtin.assert:
    that:
      - kubernetes_cni in ["flannel"]
      - kubernetes_cni_state in ["present", "absent"]
    fail_msg: >-
      Unsupported Kubernetes CNI configuration:
      {{ kubernetes_cni }} / {{ kubernetes_cni_state }}

- name: "Uninstalling Kubernetes"
  ansible.builtin.include_tasks: uninstall.yml
  when: state in ["absent", "uninstall"]

- name: "Ensuring Kubernetes host preparation"
  ansible.builtin.include_tasks: host_preparation.yml
  when: state in ["present", "install"]

- name: "Applying Kubernetes host preparation before bootstrap"
  ansible.builtin.meta: flush_handlers
  when: state in ["present", "install"]

- name: "Ensuring Kubernetes control plane is present"
  ansible.builtin.include_tasks: control_plane_present.yml
  when:
    - state in ["present", "install"]
    - kubernetes_control_plane_state == "present"

- name: "Ensuring Kubernetes CNI is absent"
  ansible.builtin.include_tasks: "cni_{{ kubernetes_cni }}_absent.yml"
  when:
    - state in ["present", "install"]
    - kubernetes_cni_state == "absent"

- name: "Ensuring Kubernetes CNI is present"
  ansible.builtin.include_tasks: "cni_{{ kubernetes_cni }}_present.yml"
  when:
    - state in ["present", "install"]
    - kubernetes_control_plane_state == "present"
    - kubernetes_cni_state == "present"
    - kubernetes_control_plane_inventory_hostname | length == 0
      or inventory_hostname == kubernetes_control_plane_inventory_hostname

- name: "Ensuring Kubernetes control plane is absent"
  ansible.builtin.include_tasks: control_plane_absent.yml
  when:
    - state in ["present", "install"]
    - kubernetes_control_plane_state == "absent"

- name: "Ensuring Kubernetes worker node is joined"
  ansible.builtin.include_tasks: worker_present.yml
  when:
    - state in ["present", "install"]
    - kubernetes_worker_state == "present"

- name: "Ensuring Kubernetes worker node is absent"
  ansible.builtin.include_tasks: worker_absent.yml
  when:
    - state in ["present", "install"]
    - kubernetes_worker_state == "absent"

- name: "Reporting Kubernetes role smoke-test readiness"
  ansible.builtin.debug:
    msg: >-
      Kubernetes role smoke test reached {{ inventory_hostname }} on
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_major_version"] }}
