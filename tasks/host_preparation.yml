---

- name: "Disabling active swap"
  ansible.builtin.command: swapoff --all
  when:
    - kubernetes_manage_swap | bool
    - ansible_facts["swaptotal_mb"] | int > 0
  changed_when: true

- name: "Disabling swap entries in fstab"
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(\\s*[^#].*\\s+swap\\s+.*)$"
    replace: "# Kubernetes disabled: \\1"
  when:
    - kubernetes_manage_swap | bool
    - kubernetes_disable_swap_persistently | bool

- name: "Ensuring Kubernetes kernel modules are loaded"
  ansible.builtin.command: "modprobe {{ item }}"
  loop: "{{ kubernetes_kernel_modules }}"
  loop_control:
    loop_var: kubernetes_kernel_module
    label: "{{ kubernetes_kernel_module }}"
  vars:
    item: "{{ kubernetes_kernel_module }}"
  changed_when: false

- name: "Persisting Kubernetes kernel modules"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: "{{ kubernetes_kernel_modules | join('\\n') }}\\n"
    owner: root
    group: root
    mode: "0644"

- name: "Rendering Kubernetes sysctl configuration"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      {% for key, value in kubernetes_sysctl.items() %}
      {{ key }} = {{ value }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  register: kubernetes_sysctl_config
  notify: "Apply Kubernetes sysctl configuration"

- name: "Gathering service facts for Kubernetes host preparation"
  ansible.builtin.service_facts:

- name: "Checking Kubernetes API traffic in firewalld"
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent --query-port={{ kubernetes_control_plane_api_port }}/tcp
  register: kubernetes_firewalld_api_port_check
  changed_when: false
  failed_when: kubernetes_firewalld_api_port_check.rc not in [0, 1]
  when:
    - kubernetes_manage_firewalld | bool
    - kubernetes_control_plane_state == "present"
    - ansible_facts.services["firewalld.service"] is defined
    - ansible_facts.services["firewalld.service"].state == "running"

- name: "Allowing Kubernetes API traffic through firewalld"
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent
      --add-port={{ kubernetes_control_plane_api_port }}/tcp
  register: kubernetes_firewalld_api_port
  changed_when: true
  notify: "Reload firewalld for Kubernetes"
  when:
    - kubernetes_manage_firewalld | bool
    - kubernetes_control_plane_state == "present"
    - ansible_facts.services["firewalld.service"] is defined
    - ansible_facts.services["firewalld.service"].state == "running"
    - kubernetes_firewalld_api_port_check.rc == 1

- name: "Ensuring SELinux policy package is installed"
  ansible.builtin.package:
    name: "{{ kubernetes_selinux_package }}"
    state: present
  when: kubernetes_manage_selinux | bool

- name: "Ensuring SELinux context management tools are installed"
  ansible.builtin.package:
    name: "{{ kubernetes_selinux_tools_package }}"
    state: present
  when: kubernetes_manage_selinux | bool

- name: "Checking whether Kubernetes etcd data directory exists"
  ansible.builtin.stat:
    path: /var/lib/etcd
  register: kubernetes_etcd_directory_before

- name: "Ensuring Kubernetes etcd data directory exists"
  ansible.builtin.file:
    path: /var/lib/etcd
    state: directory
    owner: root
    group: root
    mode: "0700"
  register: kubernetes_etcd_directory
  when:
    - kubernetes_control_plane_state == "present"

- name: "Marking Kubernetes etcd data directory as role-owned"
  ansible.builtin.copy:
    content: "ansible-iac-role-kubernetes\n"
    dest: "{{ kubernetes_etcd_ownership_marker }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - kubernetes_control_plane_state == "present"
    - not kubernetes_etcd_directory_before.stat.exists
    - kubernetes_etcd_directory.changed

- name: "Ensuring Kubernetes CNI host paths exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/cni/bin
    - /etc/cni/net.d
    - /run/flannel
  when:
    - kubernetes_manage_selinux | bool
    - kubernetes_cni_state == "present"
    - >-
      kubernetes_control_plane_state == "present" or
      kubernetes_worker_state == "present"

- name: "Validating Kubernetes SELinux restorecon paths"
  ansible.builtin.assert:
    that:
      - kubernetes_selinux_restorecon_path is string
      - kubernetes_selinux_restorecon_path | trim | length > 1
      - kubernetes_selinux_restorecon_path is match("^/")
      - kubernetes_selinux_restorecon_path is not search('[(){}*+?|]')
    fail_msg: >-
      Invalid SELinux restorecon path derived from
      '{{ kubernetes_selinux_context_record.target }}'.
  loop: "{{ kubernetes_selinux_file_contexts }}"
  loop_control:
    loop_var: kubernetes_selinux_context_record
    label: "{{ kubernetes_selinux_context_record.target }}"
  vars:
    kubernetes_selinux_restorecon_path: >-
       {{ kubernetes_selinux_context_record.target | trim
          | split('(/.*)?', 1) | first }}
  when: kubernetes_manage_selinux | bool

- name: "Checking existing Kubernetes SELinux restorecon paths"
  ansible.builtin.stat:
    path: >-
       {{ kubernetes_selinux_context_record.target | trim
          | split('(/.*)?', 1) | first }}
  loop: "{{ kubernetes_selinux_file_contexts }}"
  loop_control:
    loop_var: kubernetes_selinux_context_record
    label: "{{ kubernetes_selinux_context_record.target }}"
  register: kubernetes_selinux_restorecon_paths
  when: kubernetes_manage_selinux | bool

- name: "Reading existing Kubernetes SELinux file contexts"
  ansible.builtin.command:
    cmd: semanage fcontext -l -C
  register: kubernetes_existing_selinux_contexts
  changed_when: false
  when: kubernetes_manage_selinux | bool

- name: "Registering new Kubernetes SELinux file contexts"
  ansible.builtin.command:
    cmd: >-
      semanage fcontext --add --type {{ kubernetes_selinux_context_record.type }}
      {{ kubernetes_selinux_context_record.target }}
  loop: "{{ kubernetes_selinux_file_contexts }}"
  loop_control:
    loop_var: kubernetes_selinux_context_record
    label: "{{ kubernetes_selinux_context_record.target }}"
  register: kubernetes_selinux_context_additions
  changed_when: kubernetes_selinux_context_additions.rc == 0
  failed_when: >-
    kubernetes_selinux_context_additions.rc != 0 and
    "already defined" not in kubernetes_selinux_context_additions.stderr
  when:
    - kubernetes_manage_selinux | bool
    - kubernetes_selinux_context_record.target not in kubernetes_existing_selinux_contexts.stdout

- name: "Prechecking Kubernetes SELinux file contexts"
  ansible.builtin.command:
    argv:
      - "restorecon"
      - "-n"
      - "-vR"
      - >-
        {{ item.kubernetes_selinux_context_record.target | trim
           | split('(/.*)?', 1) | first }}
  loop: "{{ kubernetes_selinux_restorecon_paths.results | default([]) }}"
  loop_control:
    label: "{{ item.kubernetes_selinux_context_record.target }}"
  register: kubernetes_selinux_restorecon_precheck
  changed_when: false
  failed_when: kubernetes_selinux_restorecon_precheck.rc != 0
  when:
    - kubernetes_manage_selinux | bool
    - item.stat.exists
    - item.stat.isdir or item.stat.isreg

- name: "Relabel Kubernetes SELinux file contexts when required"
  ansible.builtin.command:
    argv:
      - "restorecon"
      - "-vR"
      - >-
        {{ item.item.kubernetes_selinux_context_record.target | trim
           | split('(/.*)?', 1) | first }}
  loop: "{{ kubernetes_selinux_restorecon_precheck.results | default([]) }}"
  loop_control:
    label: "{{ item.item.kubernetes_selinux_context_record.target }}"
  register: kubernetes_selinux_restorecon_result
  changed_when: >-
    'Relabeled' in (kubernetes_selinux_restorecon_result.stdout | default(''))
  when:
    - kubernetes_manage_selinux | bool
    - >-
      'Would relabel' in (item.stdout | default(''))

- name: "Checking Kubernetes SELinux context ownership marker"
  ansible.builtin.stat:
    path: "{{ kubernetes_selinux_context_marker }}"
  register: kubernetes_selinux_context_marker_stat
  when: kubernetes_manage_selinux | bool

- name: "Reading Kubernetes SELinux context ownership marker"
  ansible.builtin.slurp:
    src: "{{ kubernetes_selinux_context_marker }}"
  register: kubernetes_selinux_context_marker_content
  when:
    - kubernetes_manage_selinux | bool
    - kubernetes_selinux_context_marker_stat.stat.exists
    - kubernetes_selinux_context_marker_stat.stat.isreg

- name: "Recording role-owned Kubernetes SELinux file contexts"
  ansible.builtin.copy:
    content: >-
       {{ (
          (kubernetes_selinux_context_marker_content.content | default('W10=') | b64decode | from_json)
          + (kubernetes_selinux_context_additions.results
             | selectattr('rc', 'defined')
             | selectattr('rc', 'equalto', 0)
             | map(attribute='kubernetes_selinux_context_record') | list)
        ) | unique | list | to_json }}
    dest: "{{ kubernetes_selinux_context_marker }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - kubernetes_manage_selinux | bool
    - >-
      (kubernetes_selinux_context_additions.results
       | selectattr('rc', 'defined')
       | selectattr('rc', 'equalto', 0) | list | length) > 0

- name: "Ensuring SELinux is in the configured state"
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: "^SELINUX="
    line: "SELINUX={{ kubernetes_selinux_state }}"
    create: false
  when: kubernetes_manage_selinux | bool

- name: "Reading current SELinux state"
  ansible.builtin.command: getenforce
  register: kubernetes_selinux_current_state
  changed_when: false
  when: kubernetes_manage_selinux | bool

- name: "Applying SELinux runtime state"
  ansible.builtin.command: "setenforce {{ 1 if kubernetes_selinux_state == 'enforcing' else 0 }}"
  changed_when: true
  when:
    - kubernetes_manage_selinux | bool
    - kubernetes_selinux_state in ["enforcing", "permissive"]
    - >-
      (kubernetes_selinux_state == "enforcing" and
       kubernetes_selinux_current_state.stdout != "Enforcing") or
      (kubernetes_selinux_state == "permissive" and
       kubernetes_selinux_current_state.stdout == "Enforcing")

- name: "Ensuring selected Kubernetes container runtime"
  ansible.builtin.include_tasks: "runtime_{{ kubernetes_container_runtime }}.yml"

- name: "Ensuring Kubernetes package repository is configured"
  ansible.builtin.yum_repository:
    name: "{{ kubernetes_repository_name }}"
    description: "{{ kubernetes_repository_description }}"
    baseurl: "{{ kubernetes_repository_baseurl }}"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ kubernetes_repository_gpgkey }}"

- name: "Ensuring Kubernetes packages are installed"
  ansible.builtin.package:
    name: "{{ kubernetes_package_names }}"
    state: present

- name: "Ensuring kubelet is enabled and started"
  ansible.builtin.service:
    name: "{{ kubernetes_kubelet_service_name }}"
    enabled: true
    state: started

- name: "Ensuring Helm client is installed for Kubernetes applications"
  ansible.builtin.include_tasks: helm.yml
  when:
    - kubernetes_helm_install | bool
    - kubernetes_applications | selectattr("type", "equalto", "helm")
      | list | length > 0
