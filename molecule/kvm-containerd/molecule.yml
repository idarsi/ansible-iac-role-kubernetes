---

scenario:
  name: kvm-containerd

driver:
  name: default
  options:
    managed: true

ansible:
  playbooks:
    create: "${IDARSI_TEST_ENVIRONMENT}/molecule/kvm/create.yml"
    destroy: "${IDARSI_TEST_ENVIRONMENT}/molecule/kvm/destroy.yml"

platforms:
  - name: k8s-containerd-rocky9
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE}"
    kickstart: rocky9-10.ks.tmpl
    memory_mb: 4096
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 3600
    ssh_user: molecule
  - name: k8s-containerd-rocky10
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE_ROCKY10}"
    kickstart: rocky9-10.ks.tmpl
    memory_mb: 4096
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 3600
    ssh_user: molecule
  - name: k8s-containerd-rhel9
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE_RHEL9}"
    kickstart: rhel9.ks.tmpl
    memory_mb: 4096
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 3600
    ssh_user: molecule
  - name: k8s-containerd-rhel10
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE_RHEL10}"
    kickstart: rhel10.ks.tmpl
    memory_mb: 4096
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 3600
    ssh_user: molecule

provisioner:
  name: ansible
  env:
    ANSIBLE_ASYNC_DIR: "${MOLECULE_PROJECT_DIRECTORY}/.ansible_async"
    ANSIBLE_LOCAL_TEMP: "/tmp/.ansible/tmp"
    ANSIBLE_REMOTE_TMP: "/tmp/.ansible/tmp"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
