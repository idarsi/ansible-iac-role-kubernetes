---
###############################################################################
# verify.yml
# @author Arsi Atomi
###############################################################################
- name: "Verify Kubernetes uninstall"
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: "Gathering package facts"
      ansible.builtin.package_facts:
        manager: auto

    - name: "Gathering service facts"
      ansible.builtin.service_facts:

    - name: "Checking removed Kubernetes files"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/kubernetes/admin.conf
        - /etc/kubernetes/kubelet.conf
        - /var/lib/kubelet/config.yaml
        - /var/lib/kubelet/kubeadm-flags.env
        - /etc/cni/net.d/10-flannel.conflist
        - /var/lib/cni/flannel
        - /etc/modules-load.d/kubernetes.conf
        - /etc/sysctl.d/99-kubernetes.conf
        - /etc/containerd/config.toml
        - /etc/crio/crio.conf.d/02-kubernetes.conf
        - /root/.kube/config
        - /usr/local/bin/helm
        - /etc/yum.repos.d/kubernetes.repo
        - /var/lib/etcd
        - /var/lib/.ansible-iac-role-kubernetes-etcd-owned
        - /etc/selinux/.ansible-iac-role-kubernetes-fcontexts
      register: removed_kubernetes_files

    - name: "Checking each managed Kubernetes path is absent"
      ansible.builtin.assert:
        that:
          - not removed_path.stat.exists
        fail_msg: "Managed Kubernetes path remains after uninstall: {{ removed_path.item }}"
      loop: "{{ removed_kubernetes_files.results }}"
      loop_control:
        loop_var: removed_path
        label: "{{ removed_path.item }}"

    - name: "Inspecting allowed Kubernetes parent directories"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /etc/cni/net.d
      register: kubernetes_parent_directories

    - name: "Reporting allowed parent directory remnants"
      ansible.builtin.debug:
        msg: >-
          Parent directory {{ parent_path.item }} exists={{ parent_path.stat.exists }}.
          Parent existence is allowed; managed child paths are checked separately.
      loop: "{{ kubernetes_parent_directories.results }}"
      loop_control:
        loop_var: parent_path
        label: "{{ parent_path.item }}"

    - name: "Reading preserved unmanaged CNI file"
      ansible.builtin.slurp:
        src: "/etc/cni/net.d/99-unmanaged-preservation.fixture"
      register: unmanaged_cni_file

    - name: "Checking unmanaged CNI content survives both uninstall passes"
      ansible.builtin.assert:
        that:
          - >-
            unmanaged_cni_file.content | b64decode ==
            "Unmanaged CNI directory content must survive Kubernetes uninstall.\n"
        fail_msg: "Uninstall changed unmanaged content in the shared CNI directory"

    - name: "Checking Kubernetes uninstall facts"
      ansible.builtin.assert:
        that:
          - "'kubelet' not in ansible_facts.packages"
          - "'kubeadm' not in ansible_facts.packages"
          - "'kubectl' not in ansible_facts.packages"
          - "'containerd.io' not in ansible_facts.packages"
          - ansible_facts.services.get("kubelet.service", {}).get("state", "absent") != "running"
          - ansible_facts.services.get("containerd.service", {}).get("state", "absent") != "running"
        fail_msg: "Kubernetes uninstall verification failed"
